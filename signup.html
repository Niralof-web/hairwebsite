<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Signup - Perfume Store</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #f3e7e9, #e3eeff);
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      /* HEADER */
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 34px;
        background: #fff;
        box-shadow: 0 6px 18px rgba(11, 12, 13, 0.06);
        position: sticky;
        top: 0;
        z-index: 80;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .brand img {
        height: 42px;
        width: 42px;
        object-fit: cover;
        border-radius: 6px;
      }
      .brand .title {
        font-weight: 700;
        font-size: 18px;
        letter-spacing: 0.3px;
      }
      .nav {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .dropdown {
        position: relative;
      }
      .dropbtn {
        background: transparent;
        border: none;
        font-weight: 600;
        cursor: pointer;
      }
      .dropmenu {
        position: absolute;
        top: 36px;
        left: 0;
        background: #fff;
        padding: 8px;
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(10, 10, 10, 0.08);
        display: none;
      }
      .dropmenu a {
        display: block;
        padding: 8px 12px;
        color: #222;
        text-decoration: none;
        border-radius: 6px;
      }
      .dropmenu a:hover {
        background: #f5f5f5;
      }
      .dropdown:hover .dropmenu {
        display: block;
      }
      .search {
        display: flex;
        align-items: center;
        background: #f2f2f2;
        padding: 6px 10px;
        border-radius: 24px;
        gap: 8px;
      }
      .search input {
        border: 0;
        background: transparent;
        outline: none;
        width: 200px;
        font-size: 14px;
      }

      /* SIGNUP FORM */
      .main-content {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 10px;
      }
      .container {
        background: #fff;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        width: 360px;
        text-align: center;
      }
      h2 {
        margin-bottom: 20px;
        color: #333;
      }
      input[type="text"],
      input[type="email"],
      input[type="password"] {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border-radius: 8px;
        border: 1px solid #ccc;
      }
      .checkbox {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 10px 0;
        font-size: 14px;
      }
      button {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 8px;
        background-color: #111827;
        color: white;
        font-weight: bold;
        cursor: pointer;
        margin-top: 10px;
      }
      button:hover {
        background-color: #d4a373;
      }
      p {
        font-size: 14px;
        color: #555;
        margin-top: 14px;
      }
      a {
        color: #d4a373;
        text-decoration: none;
        font-weight: 600;
      }

      /* FOOTER */
      .footer {
        background-color: #000;
        color: #ccc;
        padding: 60px 80px 20px;
      }
      .footer-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 40px;
        border-bottom: 1px solid #222;
        padding-bottom: 40px;
      }
      .footer-column h3 {
        color: #f0e6d2;
        font-size: 14px;
        letter-spacing: 1px;
        margin-bottom: 15px;
      }
      .footer-column p {
        line-height: 1.6;
        font-size: 13px;
      }
      .footer-column ul {
        list-style: none;
        padding: 0;
      }
      .footer-column ul li {
        margin-bottom: 8px;
      }
      .footer-column ul li a {
        color: #ccc;
        text-decoration: none;
        font-size: 13px;
        transition: color 0.3s;
      }
      .footer-column ul li a:hover {
        color: #d4a373;
      }
      .footer-bottom {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 20px;
        border-top: 1px solid #222;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <!-- HEADER -->
    <header class="topbar">
      <div class="brand">
        <img src="Picture1.png" alt="logo" />
        <div class="title">sarissignature</div>
      </div>

      <nav class="nav" aria-label="main nav">
        <div class="dropdown">
          <button class="dropbtn">Shop ▾</button>
          <div class="dropmenu">
            <a href="perfume.html">Perfumes</a>
            <a href="cosmetics.html">Cosmetics</a>
            <a href="creams.html">Creams</a>
          </div>
        </div>

        <div class="search">
          <input id="searchInput" placeholder="Search brand or product..." />
          <button id="searchBtn">Search</button>
        </div>
      </nav>
    </header>

    <!-- MAIN SIGNUP SECTION -->
    <main class="main-content">
      <div class="container">
        <h2>Create an Account</h2>
        <form id="signupForm">
          <input type="text" id="fullname" placeholder="Full Name" required />
          <input type="text" id="username" placeholder="Username" required />
          <input
            type="text"
            id="confirmUsername"
            placeholder="Confirm Username"
            required
          />
          <input type="email" id="email" placeholder="Email" required />
          <input
            type="password"
            id="password"
            placeholder="Password"
            required
          />
          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm Password"
            required
          />
          <div class="checkbox">
            <input type="checkbox" id="terms" required />
            <label for="terms">I agree to the terms and conditions</label>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <p>Already have an account? <a href="signin.html">Sign In</a></p>
      </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
      <div class="footer-container">
        <div class="footer-column">
          <h3>ABOUT US</h3>
          <p>
            We provide authentic perfumes and luxury scents at affordable
            prices.
          </p>
        </div>
        <div class="footer-column">
          <h3>INFORMATION</h3>
          <ul>
            <li><a href="#">About Us</a></li>
            <li><a href="#">Contact</a></li>
            <li><a href="#">Privacy Policy</a></li>
          </ul>
        </div>
      </div>
      <div class="footer-bottom">
        <p>© 2025 Scentora. All Rights Reserved.</p>
      </div>
    </footer>

    <script>
      // Signup form handler
      document
        .getElementById("signupForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const fullname = document.getElementById("fullname").value.trim();
          const username = document.getElementById("username").value.trim();
          const confirmUsername = document
            .getElementById("confirmUsername")
            .value.trim();
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;
          const confirmPassword =
            document.getElementById("confirmPassword").value;

          if (username !== confirmUsername) {
            alert("Usernames do not match!");
            return;
          }
          if (password !== confirmPassword) {
            alert("Passwords do not match!");
            return;
          }

          localStorage.setItem(
            "user",
            JSON.stringify({ fullname, username, email, password })
          );
          alert("Signup successful! Redirecting to Sign In...");
          window.location.href = "signin.html";
        });

      // Redirect dropdown links to signup
      document.querySelectorAll(".dropmenu a").forEach((link) => {
        link.addEventListener("click", function (e) {
          e.preventDefault();
          alert("Please sign in first!");
          window.location.href = "signup.html";
        });
      });
    </script>
  </body>
</html>
